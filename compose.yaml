# genai-o11y: a single grafana/otel-lgtm container, reachable only from localhost.
# Hard rule: every published port uses 127.0.0.1. Do not publish 9090, 3100, 3200 or 4040 here;
# compose.debug.yaml opens 9090, 3100 and 3200 on request.
name: genai-o11y

services:
  lgtm:
    # Pinned by version and digest. Renovate opens a PR for new releases; before merging,
    # compare the bundled otelcol-config.yaml with collector/base.yaml (AGENTS.md hard rule 2).
    image: grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # Grafana
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Keep about 30 days of data (docs/design.md §5.6).
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=30d --enable-feature=created-timestamp-zero-ingestion
      LOKI_EXTRA_ARGS: -compactor.retention-enabled=true -compactor.delete-request-store=filesystem -store.retention=720h
      TEMPO_EXTRA_ARGS: -backend-worker.compaction.block-retention=720h -backend-scheduler.provider.work.compaction.block-retention=720h
      # The profile file is merged on top of base.yaml (docs/design.md §5.3).
      OTELCOL_EXTRA_ARGS: --config=file:/otel-lgtm/profile.yaml
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/genai/usage-cost.json
    volumes:
      - genai-o11y-data:/data
      - ./collector/base.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./collector/${PROFILE:-strict}.yaml:/otel-lgtm/profile.yaml:ro
      - ./grafana/provisioning/dashboards/genai.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/genai.yaml:ro
      # Drops the image's bundled RED Metrics and JVM Metrics dashboards.
      - ./grafana/provisioning/dashboards/otel-lgtm-bundled.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/genai:ro

volumes:
  genai-o11y-data:

# Opt-in override: publishes the backend APIs on localhost for debugging.
#   docker compose -f compose.yaml -f compose.debug.yaml up -d
# These APIs have no authentication. Any process on this machine can read
# (and Loki can delete) the stored telemetry while they are published.
# Go back with: docker compose up -d --force-recreate
services:
  lgtm:
    ports:
      - "127.0.0.1:9090:9090" # Prometheus
      - "127.0.0.1:3100:3100" # Loki
      - "127.0.0.1:3200:3200" # Tempo
